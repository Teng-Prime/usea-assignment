version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: usea-student-portal-web
    ports:
      - "8080:80"
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 15s
      timeout: 3s
      retries: 3
