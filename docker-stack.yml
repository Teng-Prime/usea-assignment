version: '3.8'

services:
  my_web_app:
    image: 781493733610.dkr.ecr.ap-southeast-2.amazonaws.com/usea-first-appb:v1.0.0
    ports:
      - "80:80"
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure